# CreativeCraft app catalog.
#
# kind = "release":  the hub downloads the app's portable archive straight from the project's own
#                    GitHub releases (it never re-hosts anyone's binaries), unpacks it per-user and
#                    keeps it updated. `gui` / `cli` are executable stems inside the archive.
# kind = "external": the hub only *detects* an existing install (PATH, macOS bundle, Windows
#                    Program Files) and links to the project's official download page. Use this for
#                    apps whose licence or packaging we don't want to redistribute or re-wrap.
#
# `flatpak` is an external app's Flathub id, so a Flatpak install is found too.
#
# `bugs` is where "Report a bug" goes: release apps default to their repo's GitHub issues (pre-filled
# with the app and system details); external apps name their project's own tracker.
#
# `opens` lists the file extensions an app opens, its own project format first; the Projects page
# uses it to pick the app (and icon) for each file.
#
# `mcp` is the argument list that makes `cli` speak MCP (JSON-RPC 2.0, one message per line on
# stdio). Every Craft app uses `<app>-cli mcp`. Extra MCP servers (for example a Blender add-on
# bridge) are added by the user in settings, not here.
#
# Descriptions say what an app does in generic terms: no third-party trademarks are used to
# describe our apps or the hub.

# ───────────────────────── Craft apps (MIT OR Apache-2.0) ─────────────────────────

[[app]]
id = "photocraft"
name = "PhotoCraft"
category = "Image"
summary = "Layered raster image editing: layers, masks, adjustment layers, brushes, text, PSD/PSB round-trip."
kind = "release"
repo = "storytold/photocraft"
gui = "photocraft"
cli = "photocraft-cli"
mcp = ["mcp"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/storytold/photocraft"
opens = ["pcraft", "psd", "psb", "png", "jpg", "jpeg", "webp", "tif", "tiff", "gif", "bmp", "tga", "qoi"]

