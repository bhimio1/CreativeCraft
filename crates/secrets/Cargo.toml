[package]
name = "creativecraft-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CreativeCraft L1: passwords, keys and tokens in the OS keychain (macOS Keychain, Windows Credential Manager, Secret Service), or a file only the user can read"

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }
log = { workspace = true }
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
