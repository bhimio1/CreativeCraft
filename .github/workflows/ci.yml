name: CI
on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: never

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux window-system headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - run: cargo fmt --all --check
      # Compiler and test output is also attached as one annotation per failing step, so it can be
      # read from the checks API without downloading logs.
      - name: Clippy
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            body=$(grep -E "(error|warning)(\[|:)" clippy.log | head -c 60000 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g' | sed -e 's/\r/%0D/g')
            echo "::error title=clippy::$body"
          fi
          exit $status
      - name: Test
        shell: bash
        run: |
          set +e
          cargo test --all 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            body=$(grep -E "^(error|warning)|panicked|FAILED|^---- |assertion|left:|right:" test.log | head -c 60000 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g' | sed -e 's/\r/%0D/g')
            echo "::error title=tests::$body"
          fi
          exit $status
