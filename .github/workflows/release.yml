name: Release

# Push a tag like v0.1.3 (or run manually with a tag) to build every platform and publish a
# GitHub release. Asset names follow `creativecraft-<version>-<os>-<arch>.<ext>`, the same
# convention the hub's own installer reads.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.3); created from the selected branch if missing"
        required: true
      publish:
        description: "Publish the release and the AUR package (untick for a dry run: build and test only)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # fails in seconds, before any building, when the tag and Cargo.toml disagree
  check:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          tag_version=${TAG#v}
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "${TAG:0:1}" != "v" ]; then
            echo "::error title=Version::The tag must start with v (for example v$cargo_version); got '$TAG'."; exit 1
          fi
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error title=Version mismatch::You asked for $TAG, but Cargo.toml on this branch says version = \"$cargo_version\". Change the version in Cargo.toml to \"$tag_version\", commit and push it, wait for CI, then run the release again (or release v$cargo_version if that's what you meant)."
            exit 1
          fi
          echo "::notice title=Version::$TAG matches Cargo.toml"

  build:
    needs: check
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, asset: linux-x86_64, ext: tar.gz }
          - { name: Linux aarch64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, asset: linux-aarch64, ext: tar.gz }
          - { name: macOS universal, os: macos-latest, target: universal, asset: macos-universal, ext: zip }
          - { name: Windows x64, os: windows-latest, target: x86_64-pc-windows-msvc, asset: windows-x64, ext: zip }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.asset }}

      - name: Linux window-system headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Version from tag
        shell: bash
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build
        if: matrix.target != 'universal'
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p creativecraft -p creativecraft-cli
          mkdir -p out
          cp target/${{ matrix.target }}/release/creativecraft${{ runner.os == 'Windows' && '.exe' || '' }} out/
          cp target/${{ matrix.target }}/release/creativecraft-cli${{ runner.os == 'Windows' && '.exe' || '' }} out/

      - name: Build (macOS universal)
        if: matrix.target == 'universal'
        shell: bash
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target $t -p creativecraft -p creativecraft-cli
          done
          mkdir -p out
          for b in creativecraft creativecraft-cli; do
            lipo -create -output out/$b target/aarch64-apple-darwin/release/$b target/x86_64-apple-darwin/release/$b
          done
          # the app bundle (ad-hoc signed below; a Developer ID and notarization would remove the
          # first-launch warning)
          app=out/CreativeCraft.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources"
          cp out/creativecraft out/creativecraft-cli "$app/MacOS/"
          cp packaging/macos/CreativeCraft.icns "$app/Resources/"
          cat > "$app/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>CreativeCraft</string>
            <key>CFBundleIdentifier</key><string>org.creativecraft.CreativeCraft</string>
            <key>CFBundleExecutable</key><string>creativecraft</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>CreativeCraft</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.graphics-design</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict></plist>
          EOF
          rm out/creativecraft
          # Apple Silicon only runs signed code; sign the inner tool, then the bundle as a whole
          codesign --force --sign - --identifier org.creativecraft.CreativeCraft.cli "$app/MacOS/creativecraft-cli"
          codesign --force --sign - out/CreativeCraft.app
          codesign --verify --deep --strict --verbose=2 out/CreativeCraft.app

      - name: Package
        shell: bash
        run: |
          name=creativecraft-${VERSION}-${{ matrix.asset }}
          mkdir -p "dist/$name"
          cp -R out/. "dist/$name/"
          cp README.md NOTICE LICENSE-MIT LICENSE-APACHE "dist/$name/"
          if [ "$RUNNER_OS" = "Linux" ]; then
            # desktop integration, used by the AUR and Flatpak packages and by anyone installing by hand
            id=org.creativecraft.CreativeCraft
            share="dist/$name/share"
            install -Dm644 packaging/linux/$id.desktop "$share/applications/$id.desktop"
            install -Dm644 packaging/linux/$id.metainfo.xml "$share/metainfo/$id.metainfo.xml"
            sed -i "s|<!-- the release workflow inserts the current version here -->|<release version=\"$VERSION\" date=\"$(date -u +%F)\"/>|" "$share/metainfo/$id.metainfo.xml"
            for s in 128 256 512; do install -Dm644 packaging/linux/icons/$s.png "$share/icons/hicolor/${s}x${s}/apps/$id.png"; done
          fi
          cd dist
          if [ "${{ matrix.ext }}" = "zip" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip "$name.zip" "$name" > /dev/null; else zip -qry "$name.zip" "$name"; fi
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$name.${{ matrix.ext }}" > "$name.${{ matrix.ext }}.sha256"; else shasum -a 256 "$name.${{ matrix.ext }}" > "$name.${{ matrix.ext }}.sha256"; fi

      # ── Windows installer (.msi) ──────────────────────────────────────────────────────────────
      - name: Install WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build the MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # MSI versions are numbers only: 0.2.1-beta.1 installs as 0.2.1
          $msiVersion = ($env:VERSION -split '-')[0]
          $out = "dist\creativecraft-$env:VERSION-windows-x64.msi"
          wix build packaging\windows\creativecraft.wxs -arch x64 -ext WixToolset.UI.wixext `
            -d "Version=$msiVersion" -d "BinDir=$PWD\out" -d "DocDir=$PWD" -o $out
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=MSI::wix build failed (see the step log)"; exit 1 }
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $out -Leaf)" | Out-File -Encoding ascii "$out.sha256"
          Get-Item $out | Format-List Name, Length

      # install it, check every piece landed, run the CLI from PATH, uninstall, check it's all gone
      - name: Test the MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Fail($msg) { Write-Output "::error title=MSI test::$msg"; exit 1 }
          $msi = (Resolve-Path dist\*.msi).Path
          # an "old version" first, so the real install has to upgrade it in place
          $old = "$env:RUNNER_TEMP\old.msi"
          wix build packaging\windows\creativecraft.wxs -arch x64 -ext WixToolset.UI.wixext -d "Version=0.0.1" -d "BinDir=$PWD\out" -d "DocDir=$PWD" -o $old
          $p = Start-Process msiexec -ArgumentList "/i `"$old`" /qn /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Fail "installing the old version exited $($p.ExitCode)" }
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /norestart /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { $tail = (Get-Content install.log -Tail 40) -join '%0A'; Fail "install exited $($p.ExitCode)%0A$tail" }
          $entries = @(Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object DisplayName -eq 'CreativeCraft')
          if ($entries.Count -ne 1) { Fail "upgrade left $($entries.Count) CreativeCraft entries in Apps & features: $($entries.DisplayVersion -join ', ')" }
          if ($entries[0].DisplayVersion -eq '0.0.1') { Fail "the old version is still the one installed" }
          $dir = "$env:ProgramFiles\CreativeCraft"
          foreach ($f in 'creativecraft.exe', 'creativecraft-cli.exe', 'README.md', 'NOTICE.txt', 'LICENSE-MIT.txt', 'LICENSE-APACHE.txt') {
            if (-not (Test-Path "$dir\$f")) { Fail "$f missing from $dir" }
          }
          $lnk = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\CreativeCraft.lnk"
          if (-not (Test-Path $lnk)) { Fail "Start menu shortcut missing" }
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if ($machinePath -notlike "*$dir*") { Fail "install folder not added to PATH" }
          $env:Path = "$machinePath;$env:Path"
          $v = & creativecraft-cli --version
          if ($LASTEXITCODE -ne 0 -or "$v" -notlike "*$(($env:VERSION -split '-')[0])*") { Fail "creativecraft-cli --version printed '$v'" }
          $app = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object DisplayName -eq 'CreativeCraft'
          if (-not $app) { Fail "not listed in Apps & features" }
          Write-Output "Installed $($app.DisplayName) $($app.DisplayVersion); CLI says: $v"
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn /norestart /l*v uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Fail "uninstall exited $($p.ExitCode)" }
          if (Test-Path "$dir\creativecraft.exe") { Fail "files left behind after uninstall" }
          if (Test-Path $lnk) { Fail "shortcut left behind after uninstall" }
          if ([Environment]::GetEnvironmentVariable('Path', 'Machine') -like "*$dir*") { Fail "PATH entry left behind after uninstall" }
          Write-Output "::notice title=MSI::upgrades an older version in place, installs, runs from PATH, and uninstalls cleanly"

      # ── macOS disk image (.dmg) ───────────────────────────────────────────────────────────────
      - name: Build the DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          name=creativecraft-${VERSION}-macos-universal
          stage=$(mktemp -d)/CreativeCraft
          mkdir -p "$stage"
          cp -R out/CreativeCraft.app "$stage/"
          ln -s /Applications "$stage/Applications"   # drag the app onto this to install
          hdiutil create -volname "CreativeCraft" -srcfolder "$stage" -fs HFS+ -format UDZO -ov "dist/$name.dmg"
          (cd dist && shasum -a 256 "$name.dmg" > "$name.dmg.sha256")
          ls -la dist/*.dmg

      # mount it, check the app and the Applications shortcut, install by copying, run it, detach
      - name: Test the DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          fail() { echo "::error title=DMG test::$1"; exit 1; }
          dmg=$(ls dist/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt" >/dev/null || fail "hdiutil attach failed"
          app="$mnt/CreativeCraft.app"
          [ -x "$app/Contents/MacOS/creativecraft" ] || fail "app executable missing"
          [ -f "$app/Contents/Resources/CreativeCraft.icns" ] || fail "app icon missing"
          [ "$(readlink "$mnt/Applications")" = "/Applications" ] || fail "Applications shortcut missing"
          out=$(codesign --verify --deep --strict "$app" 2>&1) || fail "signature doesn't verify: $out"
          lipo -archs "$app/Contents/MacOS/creativecraft" | grep -q arm64 || fail "not a universal binary"
          cp -R "$app" /Applications/ || fail "copying to /Applications failed"
          hdiutil detach "$mnt" >/dev/null || fail "hdiutil detach failed"
          v=$(/Applications/CreativeCraft.app/Contents/MacOS/creativecraft-cli --version 2>&1) || fail "the installed CLI didn't run: $v"
          case "$v" in *"${VERSION%%-*}"*) ;; *) fail "creativecraft-cli --version printed '$v'";; esac
          rm -rf /Applications/CreativeCraft.app
          echo "::notice title=DMG::mounts, installs by drag and drop, signature verifies, runs ($v)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.msi
            dist/*.dmg
            dist/*.sha256

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04 }
          - { arch: aarch64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dl

      - name: Version from tag
        shell: bash
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Install flatpak-builder and the runtime
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Build the bundle from the release archive
        run: |
          tar -xzf dl/creativecraft-${VERSION}-linux-${{ matrix.arch }}.tar.gz -C packaging/flatpak
          mv packaging/flatpak/creativecraft-${VERSION}-linux-${{ matrix.arch }} packaging/flatpak/input
          flatpak-builder --user --disable-rofiles-fuse --force-clean --repo=repo build packaging/flatpak/org.creativecraft.CreativeCraft.yml
          mkdir -p dist
          out=dist/creativecraft-${VERSION}-linux-${{ matrix.arch }}.flatpak
          flatpak build-bundle --arch=${{ matrix.arch }} --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo repo "$out" org.creativecraft.CreativeCraft
          (cd dist && sha256sum "$(basename "$out")" > "$(basename "$out").sha256")
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: dist/*

  release:
    needs: [build, flatpak]
    # a manual run with "publish" unticked stops here: everything is built and tested, nothing published
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        run: cd assets && cat *.sha256 > SHA256SUMS && ls -la

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CreativeCraft ${{ env.TAG }}
          prerelease: true
          generate_release_notes: true
          body: |
            Pre-alpha preview build of CreativeCraft: one home for open-source creative apps, with cloud sync and an AI assistant that drives the apps over MCP.

            **Install:**
            - **Windows:** download the `.msi` and double-click it. It installs to Program Files with a Start menu shortcut and updates any older version. Windows may show a SmartScreen warning for this unsigned installer: choose **More info → Run anyway**.
            - **macOS:** open the `.dmg` and drag CreativeCraft onto Applications. The app isn't notarized by Apple yet, so the first time macOS says it can't verify it: open **System Settings → Privacy & Security** and choose **Open Anyway**.
            - **Portable:** the `.zip` / `.tar.gz` archives need no installer: unpack and run `creativecraft`. `creativecraft-cli` is the command-line version and the MCP server.
            - Linux: the `.flatpak` bundle installs with `flatpak install --user creativecraft-*.flatpak` (it pulls the Freedesktop runtime from Flathub). On Arch, install `creativecraft-bin` from the AUR, or build it from the `PKGBUILD` attached here.
            - Verify downloads against `SHA256SUMS`.

            This is a pitch build that includes ArtCraft branding; see NOTICE.
          files: |
            assets/*.tar.gz
            assets/*.zip
            assets/*.msi
            assets/*.dmg
            assets/*.flatpak
            assets/SHA256SUMS

  aur:
    name: AUR package
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: assets
          merge-multiple: true

      - name: Generate PKGBUILD and .SRCINFO
        shell: bash
        run: |
          VERSION=${TAG#v}
          sha() { cut -d' ' -f1 "assets/creativecraft-${VERSION}-linux-$1.tar.gz.sha256"; }
          mkdir -p aur
          sed -e "s/@VERSION@/${VERSION}/" -e "s/@SHA256_X86_64@/$(sha x86_64)/" -e "s/@SHA256_AARCH64@/$(sha aarch64)/" packaging/aur/PKGBUILD.in > aur/PKGBUILD
          packaging/aur/srcinfo.sh aur/PKGBUILD > aur/.SRCINFO
          cat aur/PKGBUILD aur/.SRCINFO

      # What makepkg would do, without needing an Arch container: fetch each source from the
      # published release, check its checksum, run package() into a scratch root.
      - name: Test the package against the published release
        shell: bash
        run: |
          set -euo pipefail
          source aur/PKGBUILD
          for CARCH in "${arch[@]}"; do
            src="source_${CARCH}[0]"; sum="sha256sums_${CARCH}[0]"
            work=$(mktemp -d); pkgdir=$(mktemp -d)
            curl -fsSL --retry 3 -o "$work/pkg.tar.gz" "${!src}"
            echo "${!sum}  $work/pkg.tar.gz" | sha256sum -c -
            tar -xzf "$work/pkg.tar.gz" -C "$work"
            (cd "$work" && srcdir="$work" pkgdir="$pkgdir" CARCH="$CARCH" package)
            echo "== $CARCH"; (cd "$pkgdir" && find . -type f | sort)
            test -x "$pkgdir/usr/bin/creativecraft" && test -x "$pkgdir/usr/bin/creativecraft-cli"
            test -f "$pkgdir/usr/share/applications/org.creativecraft.CreativeCraft.desktop"
          done
          cp aur/PKGBUILD creativecraft-bin.PKGBUILD

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: creativecraft-bin.PKGBUILD

      - uses: actions/upload-artifact@v4
        with:
          name: aur
          include-hidden-files: true
          path: |
            aur/PKGBUILD
            aur/.SRCINFO

  aur-publish:
    needs: aur
    uses: ./.github/workflows/aur-publish.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
    secrets: inherit
