# Flatpak manifest. The release workflow unpacks the Linux release archive into `input/` next to
# this file and builds a single-file bundle from it (no compiling inside flatpak-builder).
#
# Permissions:
# - home: the projects folder lives there, and agent CLIs read their config from it
# - network: app downloads, cloud sync, agent CLIs
# - wayland/x11/dri/ipc: the egui window on wgpu
# - org.freedesktop.Flatpak: lets the hub start programs on the host (agent CLIs, external apps,
#   git/cargo source builds) through `flatpak-spawn --host`
app-id: org.creativecraft.CreativeCraft
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: creativecraft
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Flatpak
  # passwords, API keys and the Google token go in the desktop keyring (Secret Service)
  - --talk-name=org.freedesktop.secrets
modules:
  - name: creativecraft
    buildsystem: simple
    build-commands:
      - install -Dm755 creativecraft /app/bin/creativecraft
      - install -Dm755 creativecraft-cli /app/bin/creativecraft-cli
      - install -Dm644 share/applications/org.creativecraft.CreativeCraft.desktop /app/share/applications/org.creativecraft.CreativeCraft.desktop
      - install -Dm644 share/metainfo/org.creativecraft.CreativeCraft.metainfo.xml /app/share/metainfo/org.creativecraft.CreativeCraft.metainfo.xml
      - for s in 128 256 512; do install -Dm644 share/icons/hicolor/${s}x${s}/apps/org.creativecraft.CreativeCraft.png /app/share/icons/hicolor/${s}x${s}/apps/org.creativecraft.CreativeCraft.png; done
      - install -Dm644 -t /app/share/licenses/creativecraft LICENSE-MIT LICENSE-APACHE NOTICE
    sources:
      - type: dir
        path: input
